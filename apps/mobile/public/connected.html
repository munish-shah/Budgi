<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark light" />
<title>Connected · Budgi</title>
<style>
  :root { --bg: #08080A; --fg: #F5F5F7; --muted: #9C9CA5; --accent: #7CF2B0; }
  @media (prefers-color-scheme: light) { :root { --bg: #F3F3F6; --fg: #0B0B0E; --muted: #6A6A73; --accent: #0FAF62; } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 17px/1.45 -apple-system, system-ui, sans-serif; }
  main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 32px; box-sizing: border-box; gap: 12px; }
  .mark { width: 72px; height: 72px; border-radius: 20px; }
  h1 { font-size: 26px; margin: 8px 0 0; }
  p { color: var(--muted); margin: 0; max-width: 320px; }
</style>
</head>
<body>
<main>
  <img class="mark" src="/apple-touch-icon.png" alt="" />
  <h1>You’re connected</h1>
  <p>Close this page and switch back to Budgi. Your accounts appear there automatically.</p>
</main>
</body>
</html>
