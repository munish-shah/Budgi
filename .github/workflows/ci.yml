name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build the installable web app
        run: npm run build:pwa -w @budgi/mobile
      - name: Bundle the Cloudflare Worker (dry run)
        run: npx wrangler deploy --dry-run --outdir /tmp/worker
        working-directory: apps/server
